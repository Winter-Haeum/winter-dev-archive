<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="refresh" content="0" />
<title>Winter Dev Archive — 새 주소로 이동</title>
<script>
  // 구주소(/winter-dev-archive/...)의 모든 하위 경로를
  // 새 루트 주소(https://winter-haeum.github.io/...)로 그대로 이동한다.
  // 예) /winter-dev-archive/coding-test/... → https://winter-haeum.github.io/coding-test/...
  //     /winter-dev-archive/               → https://winter-haeum.github.io/
  var newPath = location.pathname.replace(/^\/winter-dev-archive\//, '/');
  var target = 'https://winter-haeum.github.io' + newPath + location.search + location.hash;
  location.replace(target);
</script>
</head>
<body>
  <p>이 주소는 이동했습니다. 자동으로 이동하지 않으면
    <a id="link" href="https://winter-haeum.github.io/">새 주소</a>를 눌러주세요.</p>
  <script>
    document.getElementById('link').href = target;
  </script>
</body>
</html>
